# Dev-only MySQL. On the Windows host you can use a native MySQL install instead.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: mt_access
      MYSQL_USER: mtadmin
      MYSQL_PASSWORD: change_me
      MYSQL_ROOT_PASSWORD: change_root
    ports: ["3306:3306"]
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes: [mysql_data:/var/lib/mysql]
volumes:
  mysql_data:
